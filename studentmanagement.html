<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>student management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>

  <h2 class="text-center mt-5">Student management</h2>
  <div class=" mb-3 mt-5">
    <input type="text" id="name" placeholder="enter name" class="form-control">
    <br><br>
    <input type="text" id="course" placeholder="enter course" class="form-control">
    <br><br>
    <button onclick="addStudent()" id="submitButton" type="button" class="btn btn-success">Add Student</button>
    <button onclick="clearForm()" type="button" class="btn btn-warning">Clear</button>
    <table class="table table-bordered">
  <table class="table table-bordered table-striped border-primary">
    <thead>
      <tr>
        <th scope="col">Student ID</th>
        <th scope="col">NAME</th>
        <th scope="col">COURSE</th>
        <th scope="col">ACTION</th>
      </tr>
    </thead>
    <tbody id="result"></tbody>
  </table>
</body>
<script>
  let students = JSON.parse(localStorage.getItem("students")) || [];
  let editId = null;
  let count = students.length > 0 ? students[students.length - 1].id + 1 : 1

  function addStudent() {
    let name = document.getElementById("name").value;
    let course = document.getElementById("course").value;

    if (name === "" || course === "") {
      alert("enter name and value")
      return;
    }

    if (editId == null) {

      let student = {
        id: count++,
        name: name,
        course: course
      }

      students.push(student)

      alert("student added successfully")

    } else {

      students.forEach(function (item) {
        if (item.id === editId) {
            item.name = name;
            item.course = course;
        }
      })
      editId = null;
      alert("student Updated successfully");
    }
    localStorage.setItem("students", JSON.stringify(students))
    displayStudents()
    clearInputs()
  }

  function displayStudents() {
    let data = "";
    students.forEach(function (item) {

      data += `
        <tr>
            <td>${item.id}</td>
            <td>${item.name}</td>
            <td>${item.course}</td>
            <td>
                <button  type="button" class="btn btn-warning" onclick="editStudent(${item.id})">Edit</button>
                <button  type="button" class="btn btn-danger" onclick="deleteStudent(${item.id})">Delete</button>
            </td>
        </tr>
        `
    })

    document.getElementById("result").innerHTML = data;
  }

  function clearInputs() {
    document.getElementById("name").value = "";
    document.getElementById("course").value = "";
    editId = null;
    document.getElementById("submitButton").innerText = "Add student"
  }

  function deleteStudent(id) {
      students = students.filter(item => { return item.id !== id })
      localStorage.setItem("students", JSON.stringify(students))
      displayStudents()
      clearInputs()
      alert("student deleted!")
    }


  function editStudent(id) {
    let student = students.find(item => item.id == id)
    document.getElementById("name").value = student.name;
    document.getElementById("course").value = student.course;
    editId = id;
  }

  displayStudents()
</script>

</html>
